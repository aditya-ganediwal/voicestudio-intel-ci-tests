name: Public Intel third-party foundation (not production accepted)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-intel-foundation
  cancel-in-progress: false
jobs:
  native-foundation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove native host and synthetic round-trip
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 scripts/native_foundation.py selftest
      - name: Build pinned third-party Intel foundation
        run: |
          set -euo pipefail
          test -f public-intel-lock.json
          python3 scripts/native_foundation.py build
      - name: Report output hashes and inventory
        run: |
          set -euo pipefail
          cat out/public-foundation-report.json >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 out/public-intel-foundation.tar.gz
      - name: Upload public third-party foundation only
        uses: actions/upload-artifact@v4
        with:
          name: public-intel-third-party-foundation-${{ github.run_id }}
          path: |
            out/public-intel-foundation.tar.gz
            out/public-foundation-report.json
          if-no-files-found: error
          retention-days: 1
